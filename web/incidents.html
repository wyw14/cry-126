<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TideShield · 事件处置</title><link rel="stylesheet" href="/app.css"></head>
<body><header><div class="brand">TideShield</div><nav><a href="/operations.html">运行周期</a><a href="/equipment.html">闸泵设备</a><a href="/interlocks.html">安全联锁</a><a class="active" href="/incidents.html">事件处置</a></nav><div class="live">● 事件日志在线</div></header>
<main><div class="titlebar"><div><h1>事件处置</h1><p class="subtitle">告警、封闭记录与恢复游标</p></div><button id="refresh">刷新</button></div><div class="grid"><section class="panel span-3"><h2>日志游标</h2><div class="metric" id="cursor">—</div></section><section class="panel span-3"><h2>活动告警</h2><div class="metric" id="active">—</div></section><section class="panel span-3"><h2>封闭记录</h2><div class="metric" id="closures">—</div></section><section class="panel span-3"><h2>恢复屏障</h2><div class="metric" id="barriers">—</div></section><section class="panel span-8"><h2>告警事件</h2><table><thead><tr><th>时间</th><th>级别</th><th>代码</th><th>内容</th></tr></thead><tbody id="incidents"></tbody></table></section><section class="panel span-4"><h2>封闭代际</h2><div id="closureList"></div><div id="message" class="message"></div></section></div></main>
<script src="/app.js"></script><script>
async function load(){try{const d=await api('/api/incidents');cursor.textContent=text(d.cursor);active.textContent=d.incidents.filter(x=>!x.resolved_at).length;closures.textContent=d.closures.length;barriers.textContent=d.recovery_barriers.length;incidents.innerHTML=d.incidents.length?d.incidents.map(x=>`<tr><td>${new Date(x.raised_at).toLocaleString()}</td><td>${badge(x.severity)}</td><td>${x.code}</td><td>${x.message}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">当前无活动告警</td></tr>';closureList.innerHTML=d.closures.length?d.closures.map(x=>`<div class="row"><span>G${x.operation_generation}</span>${badge(x.status)}</div>`).join(''):'<div class="muted">暂无封闭记录</div>';setMessage('message',`事件数据 ${new Date().toLocaleTimeString()}`)}catch(e){setMessage('message',e.message,true)}}refresh.onclick=load;load();setInterval(load,5000);
</script></body></html>
