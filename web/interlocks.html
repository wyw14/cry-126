<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TideShield · 安全联锁</title><link rel="stylesheet" href="/app.css"></head>
<body><header><div class="brand">TideShield</div><nav><a href="/operations.html">运行周期</a><a href="/equipment.html">闸泵设备</a><a class="active" href="/interlocks.html">安全联锁</a><a href="/incidents.html">事件处置</a></nav><div class="live">● 联锁监测在线</div></header>
<main><div class="titlebar"><div><h1>安全联锁</h1><p class="subtitle">潮位表决、防御许可与屏障封闭</p></div><button class="danger" id="close">执行全线封闭</button></div><div class="grid"><section class="panel span-4"><h2>独立证据</h2><div class="metric"><span id="votes">—</span> <small>路</small></div></section><section class="panel span-4"><h2>防御许可</h2><div class="metric" id="allowed">—</div></section><section class="panel span-4"><h2>屏障结果</h2><div class="metric" id="sealed">—</div></section><section class="panel span-6"><h2>表决状态</h2><div class="row"><span class="muted">中位潮位</span><span id="median">—</span></div><div class="row"><span class="muted">最大差值</span><span id="spread">—</span></div><div class="row"><span class="muted">许可原因</span><span id="reason">—</span></div></section><section class="panel span-6"><h2>持有联锁</h2><div id="locks"></div></section><section class="panel span-12"><h2>封闭反馈</h2><table><thead><tr><th>闸孔</th><th>位置</th><th>失败</th></tr></thead><tbody id="barrierGates"></tbody></table><div id="message" class="message"></div></section></div></main>
<script src="/app.js"></script><script>
async function load(){try{const d=await api('/api/interlocks');votes.textContent=`${d.assessment.independent_votes}/${d.assessment.required_votes}`;allowed.innerHTML=badge(d.permit.allowed?'allowed':'blocked');sealed.innerHTML=badge(d.barrier.status||'not-run');median.textContent=`${Number(d.assessment.median_meters||0).toFixed(2)} m`;spread.textContent=`${Number(d.assessment.maximum_difference||0).toFixed(2)} m`;reason.textContent=text(d.permit.reason);locks.innerHTML=d.locks.length?d.locks.map(x=>`<div class="row"><span>${x.name}</span><span>${x.holder} · G${x.operation_generation}</span></div>`).join(''):'<div class="muted">当前无独占联锁</div>';barrierGates.innerHTML=(d.barrier.gates||[]).map(x=>`<tr><td>${x.id}</td><td>${badge(x.position)}</td><td>${text(x.failure)}</td></tr>`).join('');setMessage('message',`联锁数据 ${new Date().toLocaleTimeString()}`)}catch(e){setMessage('message',e.message,true)}}
close.onclick=async()=>{try{await api('/api/interlocks/close',{method:'POST',body:'{}'});await load()}catch(e){setMessage('message',e.message,true);await load()}};load();setInterval(load,5000);
</script></body></html>
