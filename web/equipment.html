<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TideShield · 闸泵设备</title><link rel="stylesheet" href="/app.css"></head>
<body><header><div class="brand">TideShield</div><nav><a href="/operations.html">运行周期</a><a class="active" href="/equipment.html">闸泵设备</a><a href="/interlocks.html">安全联锁</a><a href="/incidents.html">事件处置</a></nav><div class="live">● 设备链路在线</div></header>
<main><div class="titlebar"><div><h1>闸泵设备</h1><p class="subtitle">闸门位置、泵组状态与涵洞占用</p></div><div class="toolbar"><select id="basin"><option value="east">东区</option><option value="west">西区</option></select><button id="drain">启动排涝</button></div></div><div class="grid"><section class="panel span-6"><h2>闸门</h2><table><thead><tr><th>设备</th><th>位置</th><th>开度</th><th>Epoch</th></tr></thead><tbody id="gates"></tbody></table></section><section class="panel span-6"><h2>泵组</h2><table><thead><tr><th>设备</th><th>分区</th><th>模式</th><th>阀证据</th></tr></thead><tbody id="pumps"></tbody></table></section><section class="panel span-12"><h2>流路与分区</h2><table><thead><tr><th>分区</th><th>当前水位</th><th>目标</th><th>涵洞</th><th>Owner</th></tr></thead><tbody id="routes"></tbody></table><div id="message" class="message"></div></section></div></main>
<script src="/app.js"></script><script>
async function load(){try{const d=await api('/api/equipment');gates.innerHTML=d.gates.map(x=>`<tr><td>${x.id}</td><td>${badge(x.position)}</td><td>${x.opening_percent}%</td><td>${x.command_epoch}</td></tr>`).join('');pumps.innerHTML=d.pumps.map(x=>`<tr><td>${x.id}</td><td>${text(x.basin)}</td><td>${badge(x.mode)}</td><td>${x.check_valve_proven?'已落盘':'未确认'}</td></tr>`).join('');routes.innerHTML=d.basins.map(x=>{const l=d.leases.find(v=>v.owner===x.id);return `<tr><td>${x.id}</td><td>${x.level_meters.toFixed(2)} m</td><td>${x.target_meters.toFixed(2)} m</td><td>${text(l&&l.culvert_id)}</td><td>${text(l&&l.owner)}</td></tr>`}).join('');setMessage('message',`设备数据 ${new Date().toLocaleTimeString()}`)}catch(e){setMessage('message',e.message,true)}}
drain.onclick=async()=>{try{await api('/api/equipment/drain',{method:'POST',body:JSON.stringify({basin:basin.value})});await load()}catch(e){setMessage('message',e.message,true)}};load();setInterval(load,5000);
</script></body></html>
