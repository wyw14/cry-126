<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TideShield · 运行周期</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header><div class="brand">TideShield</div><nav><a class="active" href="/operations.html">运行周期</a><a href="/equipment.html">闸泵设备</a><a href="/interlocks.html">安全联锁</a><a href="/incidents.html">事件处置</a></nav><div class="live">● 联控在线</div></header>
<main><div class="titlebar"><div><h1>防洪运行周期</h1><p class="subtitle">当前代际、预报峰值与沿海防御状态</p></div><div class="toolbar"><input id="reason" value="值守启动的新一轮风暴防御"><button id="start">启动周期</button></div></div>
<div class="grid"><section class="panel span-3"><h2>阶段</h2><div class="metric" id="phase">—</div></section><section class="panel span-3"><h2>代际</h2><div class="metric" id="generation">—</div></section><section class="panel span-3"><h2>峰值潮位</h2><div class="metric"><span id="peak">—</span> <small>m</small></div></section><section class="panel span-3"><h2>日志游标</h2><div class="metric" id="cursor">—</div></section><section class="panel span-12"><h2>运行明细</h2><div class="row"><span class="muted">Operation ID</span><span id="operationId">—</span></div><div class="row"><span class="muted">启动原因</span><span id="operationReason">—</span></div><div class="row"><span class="muted">预报 revision</span><span id="revision">—</span></div><div class="row"><span class="muted">安全许可</span><span id="permit">—</span></div><div id="message" class="message"></div></section></div></main>
<script src="/app.js"></script><script>
async function load(){try{const data=await api('/api/status');phase.innerHTML=badge(data.operation.phase);generation.textContent=text(data.operation.generation);peak.textContent=Number(data.forecast.peak_meters||0).toFixed(2);cursor.textContent=text(data.cursor);operationId.textContent=text(data.operation.id);operationReason.textContent=text(data.operation.reason);revision.textContent=text(data.forecast.revision_id);permit.innerHTML=badge(data.permit.allowed?'allowed':'blocked');setMessage('message',`更新于 ${new Date().toLocaleTimeString()}`);}catch(e){setMessage('message',e.message,true)}}
start.onclick=async()=>{try{await api('/api/operations',{method:'POST',body:JSON.stringify({reason:reason.value})});await load()}catch(e){setMessage('message',e.message,true)}};load();setInterval(load,5000);
</script></body></html>
